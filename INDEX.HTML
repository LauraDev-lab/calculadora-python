<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Moderna</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React e ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [display, setDisplay] = useState('0');
      const [equation, setEquation] = useState('');

      const handleNumber = (num) => {
        if (display === '0' || display === 'Erro') {
          setDisplay(String(num));
        } else {
          setDisplay(display + num);
        }
      };

      const handleOperator = (op) => {
        setEquation(display + ' ' + op + ' ');
        setDisplay('0');
      };

      const handleClear = () => {
        setDisplay('0');
        setEquation('');
      };

      const handleCalculate = () => {
        try {
          const fullExpression = equation + display;
          // Substitui os símbolos visuais pelos operadores matemáticos reais
          const sanitized = fullExpression.replace(/×/g, '*').replace(/÷/g, '/');
          const result = eval(sanitized);
          setDisplay(String(result));
          setEquation('');
        } catch (error) {
          setDisplay('Erro');
          setEquation('');
        }
      };

      const handleDecimal = () => {
        if (!display.includes('.')) {
          setDisplay(display + '.');
        }
      };

      const handleToggleSign = () => {
        if (display !== '0') {
          setDisplay(display.startsWith('-') ? display.slice(1) : '-' + display);
        }
      };

      const handlePercent = () => {
        const val = parseFloat(display) / 100;
        setDisplay(String(val));
      };

      return (
        <div className="bg-slate-800 p-6 rounded-3xl shadow-2xl w-80 border border-slate-700">
          {/* Visor */}
          <div className="bg-slate-900 p-4 rounded-2xl mb-6 text-right overflow-hidden border border-slate-700/50">
            <div className="text-xs text-slate-400 h-5 font-medium">{equation}</div>
            <div className="text-3xl font-bold text-white tracking-wider truncate">{display}</div>
          </div>

          {/* Teclado */}
          <div className="grid grid-cols-4 gap-3">
            <button onClick={handleClear} className="bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 p-4 rounded-2xl font-bold transition">AC</button>
            <button onClick={handleToggleSign} className="bg-slate-700 text-slate-200 hover:bg-slate-600 p-4 rounded-2xl font-bold transition">+/-</button>
            <button onClick={handlePercent} className="bg-slate-700 text-slate-200 hover:bg-slate-600 p-4 rounded-2xl font-bold transition">%</button>
            <button onClick={() => handleOperator('÷')} className="bg-indigo-600 text-white hover:bg-indigo-500 p-4 rounded-2xl font-bold transition">÷</button>

            <button onClick={() => handleNumber(7)} className="bg-slate-700/50 text-slate-100 hover:bg-slate-700 p-4 rounded-2xl font-bold transition">7</button>
            <button onClick={() => handleNumber(8)} className="bg-slate-700/50 text-slate-100 hover:bg-slate-700 p-4 rounded-2xl font-bold transition">8</button>
            <button onClick={() => handleNumber(9)} className="bg-slate-700/50 text-slate-100 hover:bg-slate-700 p-4 rounded-2xl font-bold transition">9</button>
            <button onClick={() => handleOperator('×')} className="bg-indigo-600 text-white hover:bg-indigo-500 p-4 rounded-2xl font-bold transition">×</button>

            <button onClick={() => handleNumber(4)} className="bg-slate-700/50 text-slate-100 hover:bg-slate-700 p-4 rounded-2xl font-bold transition">4</button>
            <button onClick={() => handleNumber(5)} className="bg-slate-700/50 text-slate-100 hover:bg-slate-700 p-4 rounded-2xl font-bold transition">5</button>
            <button onClick={() => handleNumber(6)} className="bg-slate-700/50 text-slate-100 hover:bg-slate-700 p-4 rounded-2xl font-bold transition">6</button>
            <button onClick={() => handleOperator('-')} className="bg-indigo-600 text-white hover:bg-indigo-500 p-4 rounded-2xl font-bold transition">-</button>

            <button onClick={() => handleNumber(1)} className="bg-slate-700/50 text-slate-100 hover:bg-slate-700 p-4 rounded-2xl font-bold transition">1</button>
            <button onClick={() => handleNumber(2)} className="bg-slate-700/50 text-slate-100 hover:bg-slate-700 p-4 rounded-2xl font-bold transition">2</button>
            <button onClick={() => handleNumber(3)} className="bg-slate-700/50 text-slate-100 hover:bg-slate-700 p-4 rounded-2xl font-bold transition">3</button>
            <button onClick={() => handleOperator('+')} className="bg-indigo-600 text-white hover:bg-indigo-500 p-4 rounded-2xl font-bold transition">+</button>

            <button onClick={() => handleNumber(0)} className="col-span-2 bg-slate-700/50 text-slate-100 hover:bg-slate-700 p-4 rounded-2xl font-bold transition">0</button>
            <button onClick={handleDecimal} className="bg-slate-700/50 text-slate-100 hover:bg-slate-700 p-4 rounded-2xl font-bold transition">.</button>
            <button onClick={handleCalculate} className="bg-emerald-600 text-white hover:bg-emerald-500 p-4 rounded-2xl font-bold transition">=</button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
