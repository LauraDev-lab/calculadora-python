<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Interativa em Python & Web</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --display-bg: #090d16;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --operator-bg: #6366f1;
      --operator-hover: #4f46e5;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #22c55e;
      --btn-num: #334155;
      --btn-num-hover: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: flex-start;
      max-width: 900px;
      width: 100%;
    }

    /* Calculadora */
    .calc-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header-bar h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    /* Visor */
    .display-screen {
      background: var(--display-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      text-align: right;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .display-history {
      font-size: 0.85rem;
      color: var(--text-muted);
      min-height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display-main {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--text-main);
      overflow-x: auto;
      white-space: nowrap;
      margin-top: 4px;
    }

    /* Teclado */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      outline: none;
      border: none;
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 600;
      padding: 16px;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }

    button:active {
      transform: scale(0.94);
      filter: brightness(0.9);
    }

    .btn-num {
      background: var(--btn-num);
    }
    .btn-num:hover {
      background: var(--btn-num-hover);
    }

    .btn-op {
      background: var(--operator-bg);
    }
    .btn-op:hover {
      background: var(--operator-hover);
    }

    .btn-action {
      background: #475569;
    }
    .btn-action:hover {
      background: #64748b;
    }

    .btn-clear {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
    .btn-clear:hover {
      background: var(--danger);
      color: white;
    }

    .btn-equals {
      background: var(--success);
      grid-column: span 2;
    }
    .btn-equals:hover {
      background: #16a34a;
    }

    .btn-percent {
      background: #0284c7;
    }
    .btn-percent:hover {
      background: #0369a1;
    }

    /* Painel Lateral de Histórico */
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      width: 320px;
      height: 480px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .history-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: 0.15s;
    }

    .history-item:hover {
      border-color: var(--primary);
      transform: translateX(3px);
    }

    .history-calc {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .history-res {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--success);
      margin-top: 2px;
    }

    .empty-history {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 40px;
    }

    .btn-clear-hist {
      background: transparent;
      border: 1px solid var(--card-border);
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 8px;
      color: var(--text-muted);
      box-shadow: none;
    }
    .btn-clear-hist:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    .footer-note {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Bloco Principal da Calculadora -->
    <div class="calc-card">
      <div class="header-bar">
        <h1><span>🐍</span> Python Calc</h1>
        <span class="badge">Modo Interativo</span>
      </div>

      <div class="display-screen">
        <div class="display-history" id="displayHistory">Pronto</div>
        <div class="display-main" id="displayMain">0</div>
      </div>

      <div class="keypad">
        <button class="btn-clear" onclick="limparTudo()">AC</button>
        <button class="btn-action" onclick="inverterSinal()">±</button>
        <button class="btn-percent" onclick="aplicarPorcentagem()">%</button>
        <button class="btn-op" onclick="definirOperador('/')">÷</button>

        <button class="btn-num" onclick="inserirDigito('7')">7</button>
        <button class="btn-num" onclick="inserirDigito('8')">8</button>
        <button class="btn-num" onclick="inserirDigito('9')">9</button>
        <button class="btn-op" onclick="definirOperador('*')">×</button>

        <button class="btn-num" onclick="inserirDigito('4')">4</button>
        <button class="btn-num" onclick="inserirDigito('5')">5</button>
        <button class="btn-num" onclick="inserirDigito('6')">6</button>
        <button class="btn-op" onclick="definirOperador('-')">−</button>

        <button class="btn-num" onclick="inserirDigito('1')">1</button>
        <button class="btn-num" onclick="inserirDigito('2')">2</button>
        <button class="btn-num" onclick="inserirDigito('3')">3</button>
        <button class="btn-op" onclick="definirOperador('+')">+</button>

        <button class="btn-num" onclick="inserirDigito('0')">0</button>
        <button class="btn-num" onclick="inserirPonto()">.</button>
        <button class="btn-equals" onclick="calcularResultado()">=</button>
      </div>
    </div>

    <!-- Bloco do Histórico de Cálculos -->
    <div class="history-card">
      <div class="history-header">
        <h2 style="font-size: 1rem; font-weight: 600;">📜 Histórico</h2>
        <button class="btn-clear-hist" onclick="limparHistorico()">Limpar</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-history">Nenhum cálculo registrado ainda.</div>
      </div>
    </div>
  </div>

  <div class="footer-note">
    Dica: Você também pode usar as teclas numéricas do seu teclado físico!
  </div>

  <script>
    // Sintetizador sonoro sutil via Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function tocarBeep(frequencia = 440) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequencia, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    // Estado da Calculadora
    let valorDisplay = '0';
    let primeiroOperando = null;
    let operadorAtual = null;
    let aguardandoSegundoOperando = false;
    let historicoCalculos = [];

    const displayMain = document.getElementById('displayMain');
    const displayHistory = document.getElementById('displayHistory');
    const historyList = document.getElementById('historyList');

    function atualizarDisplay() {
      displayMain.textContent = valorDisplay;
    }

    function inserirDigito(digito) {
      tocarBeep(380);
      if (aguardandoSegundoOperando) {
        valorDisplay = digito;
        aguardandoSegundoOperando = false;
      } else {
        valorDisplay = valorDisplay === '0' ? digito : valorDisplay + digito;
      }
      atualizarDisplay();
    }

    function inserirPonto() {
      tocarBeep(420);
      if (aguardandoSegundoOperando) {
        valorDisplay = '0.';
        aguardandoSegundoOperando = false;
      } else if (!valorDisplay.includes('.')) {
        valorDisplay += '.';
      }
      atualizarDisplay();
    }

    function inverterSinal() {
      tocarBeep(350);
      if (valorDisplay !== '0' && valorDisplay !== 'Erro') {
        valorDisplay = (parseFloat(valorDisplay) * -1).toString();
        atualizarDisplay();
      }
    }

    function limparTudo() {
      tocarBeep(260);
      valorDisplay = '0';
      primeiroOperando = null;
      operadorAtual = null;
      aguardandoSegundoOperando = false;
      displayHistory.textContent = 'Pronto';
      atualizarDisplay();
    }

    function definirOperador(op) {
      tocarBeep(520);
      const valorAtual = parseFloat(valorDisplay);

      if (operadorAtual && aguardandoSegundoOperando) {
        operadorAtual = op;
        displayHistory.textContent = `${primeiroOperando} ${obterSimbolo(op)}`;
        return;
      }

      if (primeiroOperando === null) {
        primeiroOperando = valorAtual;
      } else if (operadorAtual) {
        const resultado = executarOperacao(primeiroOperando, valorAtual, operadorAtual);
        valorDisplay = String(resultado);
        primeiroOperando = resultado;
        atualizarDisplay();
      }

      operadorAtual = op;
      aguardandoSegundoOperando = true;
      displayHistory.textContent = `${primeiroOperando} ${obterSimbolo(op)}`;
    }

    function aplicarPorcentagem() {
      tocarBeep(600);
      const valorAtual = parseFloat(valorDisplay);
      
      if (primeiroOperando !== null && operadorAtual) {
        // Exemplo: 200 + 10% = 20 (ou seja, calcula a porcentagem do valor base)
        const percentualCalculado = (primeiroOperando * valorAtual) / 100;
        displayHistory.textContent = `${valorAtual}% de ${primeiroOperando}`;
        valorDisplay = String(percentualCalculado);
      } else {
        // Porcentagem direta: 50% = 0.5
        displayHistory.textContent = `${valorAtual}%`;
        valorDisplay = String(valorAtual / 100);
      }
      atualizarDisplay();
    }

    function calcularResultado() {
      tocarBeep(650);
      if (operadorAtual === null || primeiroOperando === null) return;

      const segundoOperando = parseFloat(valorDisplay);
      const simbolo = obterSimbolo(operadorAtual);

      if (operadorAtual === '/' && segundoOperando === 0) {
        valorDisplay = 'Erro: ÷ por 0';
        displayHistory.textContent = `${primeiroOperando} ÷ 0`;
        atualizarDisplay();
        primeiroOperando = null;
        operadorAtual = null;
        return;
      }

      const resultado = executarOperacao(primeiroOperando, segundoOperando, operadorAtual);
      const expressao = `${primeiroOperando} ${simbolo} ${segundoOperando}`;

      displayHistory.textContent = `${expressao} =`;
      valorDisplay = String(resultado);
      atualizarDisplay();

      // Registra no Histórico
      adicionarHistorico(expressao, resultado);

      primeiroOperando = null;
      operadorAtual = null;
      aguardandoSegundoOperando = true;
    }

    function executarOperacao(a, b, op) {
      switch (op) {
        case '+': return +(a + b).toFixed(8);
        case '-': return +(a - b).toFixed(8);
        case '*': return +(a * b).toFixed(8);
        case '/': return +(a / b).toFixed(8);
        default: return b;
      }
    }

    function obterSimbolo(op) {
      if (op === '*') return '×';
      if (op === '/') return '÷';
      if (op === '-') return '−';
      return op;
    }

    function adicionarHistorico(expressao, resultado) {
      historicoCalculos.unshift({ expressao, resultado });
      renderizarHistorico();
    }

    function renderizarHistorico() {
      if (historicoCalculos.length === 0) {
        historyList.innerHTML = '<div class="empty-history">Nenhum cálculo registrado ainda.</div>';
        return;
      }

      historyList.innerHTML = historicoCalculos.map(item => `
        <div class="history-item" onclick="restaurarValor('${item.resultado}')">
          <div class="history-calc">${item.expressao} =</div>
          <div class="history-res">${item.resultado}</div>
        </div>
      `).join('');
    }

    function restaurarValor(valor) {
      tocarBeep(480);
      valorDisplay = valor;
      atualizarDisplay();
    }

    function limparHistorico() {
      historicoCalculos = [];
      renderizarHistorico();
    }

    // Suporte ao teclado físico
    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') inserirDigito(e.key);
      else if (e.key === '.' || e.key === ',') inserirPonto();
      else if (e.key === '+') definirOperador('+');
      else if (e.key === '-') definirOperador('-');
      else if (e.key === '*') definirOperador('*');
      else if (e.key === '/') { e.preventDefault(); definirOperador('/'); }
      else if (e.key === '%') aplicarPorcentagem();
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calcularResultado(); }
      else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') limparTudo();
    });
  </script>
</body>
</html>
